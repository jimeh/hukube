# A namespaced custom Resource Type, so checks cover CRDs as well as built-ins.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.sample.hukube.dev
spec:
  group: sample.hukube.dev
  names:
    kind: Widget
    plural: widgets
    singular: widget
    shortNames: [wd]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      # A CRD's own list columns, as `kubectl get` shows them.
      additionalPrinterColumns:
        - name: Size
          type: integer
          jsonPath: .spec.size
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
---
# A second Resource Type to delete, so the confirmation for a CRD can be
# checked without losing the Widget samples.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.sample.hukube.dev
spec:
  group: sample.hukube.dev
  names:
    kind: Gadget
    plural: gadgets
    singular: gadget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
