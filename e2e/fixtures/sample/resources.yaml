# Sample Resources for checking UI changes with `mise run dev:verify`:
# quiet and logging workloads, a same-named ConfigMap in a second Namespace,
# and a custom Resource.
apiVersion: v1
kind: Namespace
metadata:
  name: sample-shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: sample-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sample-shop
  labels: { app: web, tier: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: frontend }
    spec:
      containers:
        - name: web
          # k3s already pulls this image for its Pod sandboxes.
          image: rancher/mirrored-pause:3.6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sample-shop
  labels: { app: api, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: backend }
    spec:
      containers:
        - name: api
          image: rancher/mirrored-pause:3.6
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sample-shop
  labels: { app: web, tier: frontend }
spec:
  selector: { app: web }
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sample-shop
  labels: { app: api, tier: backend }
spec:
  selector: { app: api }
  ports:
    - port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: sample-shop
  labels: { app: web, tier: frontend }
data:
  greeting: hello
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sample-shop
  labels: { app: api, tier: backend }
data:
  logLevel: debug
---
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: sample-shop
  labels: { app: api, tier: backend }
stringData:
  password: not-a-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: sample-staging
  labels: { app: web, tier: frontend }
data:
  greeting: hello from staging
---
apiVersion: sample.hukube.dev/v1
kind: Widget
metadata:
  name: gizmo
  namespace: sample-shop
  labels: { app: web }
spec:
  size: 3
---
apiVersion: v1
kind: Event
metadata:
  name: web-available
  namespace: sample-shop
involvedObject:
  apiVersion: apps/v1
  kind: Deployment
  name: web
  namespace: sample-shop
reason: Available
message: Deployment web has two ready replicas.
type: Normal
source:
  component: sample
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sample-shop
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: registry.invalid/sample-shop/worker:1.4.2
---
apiVersion: v1
kind: Event
metadata:
  name: sample-shop-ready
  namespace: default
involvedObject:
  apiVersion: v1
  kind: Namespace
  name: sample-shop
reason: Ready
message: Namespace sample-shop is ready for sample Resources.
type: Normal
source:
  component: sample
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orphan-config
  namespace: sample-shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: retired
      uid: 00000000-0000-0000-0000-000000000001
    - apiVersion: legacy.example.com/v1
      kind: Gadget
      name: retired-gadget
      uid: 00000000-0000-0000-0000-000000000002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clock
  namespace: sample-shop
  labels: { app: clock }
spec:
  replicas: 2
  selector:
    matchLabels: { app: clock }
  template:
    metadata:
      labels: { app: clock }
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              printf 'Preparing clock\nLoading configuration\nSetup complete\n'
      containers:
        - name: clock
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              i=0
              long=$(printf '%3000s' '' | tr ' ' x)
              while true; do
                i=$((i + 1))
                if [ $((i % 13)) -eq 0 ]; then
                  printf '\033[1;31mERROR\033[0m clock tick %d \033[2mfailed to sync\033[0m\n' "$i"
                elif [ $((i % 7)) -eq 0 ]; then
                  printf '\033[33mWARN\033[0m clock tick %d \033[4mslow\033[0m\n' "$i"
                else
                  printf '\033[32mINFO\033[0m clock tick %d\n' "$i"
                fi
                if [ $((i % 30)) -eq 0 ]; then
                  printf 'long line: %s\n' "$long"
                  printf 'progress 0%%\rprogress 50%%\rprogress 100%%\n'
                  printf 'invalid UTF-8: \377\376 controls: \001\007\177\n'
                fi
                sleep 1
              done
        - name: ticker
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              i=0
              while true; do
                i=$((i + 1))
                printf 'ticker %d\n' "$i"
                sleep 5
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firehose
  namespace: sample-shop
  labels: { app: firehose }
spec:
  replicas: 1
  selector:
    matchLabels: { app: firehose }
  template:
    metadata:
      labels: { app: firehose }
    spec:
      containers:
        - name: firehose
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              while true; do
                awk 'BEGIN { for (i = 1; i <= 300000; i++) printf "%06d firehose abcdefghijklmnopqrstuvwxyz abcdefghijklmnopqrstuvwxyz abcdefghijklmnopqrstuvwxyz\n", i }'
                sleep 30
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: sample-shop
  labels: { app: crasher }
spec:
  replicas: 1
  selector:
    matchLabels: { app: crasher }
  template:
    metadata:
      labels: { app: crasher }
    spec:
      containers:
        - name: crasher
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              printf 'Starting crasher\nLoading jobs\nProcessing job 42\n'
              sleep 20
              printf 'ERROR: job failed\n  at processJob (worker.go:42)\n  at main (main.go:17)\n'
              exit 1
