apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.sample.hukube.dev
spec:
  group: sample.hukube.dev
  names: { kind: Widget, plural: widgets, singular: widget }
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size: { type: integer, minimum: 0 }
                message: { type: string }
                replicas: { type: integer, minimum: 0 }
                enabled: { type: boolean }
                options:
                  type: object
                  additionalProperties: { type: string }
                endpoints:
                  type: array
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: { type: string }
                      url: { type: string }
