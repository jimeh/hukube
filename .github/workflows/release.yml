name: Desktop release

on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA of the existing draft release
        required: true
        type: string
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        required: true
      MACOS_SIGN_P12:
        required: true
      MACOS_SIGN_PASSWORD:
        required: true
      MACOS_NOTARY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: Same full commit SHA as the failed draft
        required: true
        type: string
      tag:
        description: Same existing v-prefixed tag as the failed draft
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_SHA: ${{ inputs.sha }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: mise run install
      - run: mise run release:guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: mac-arm64
          - runner: macos-15-intel
            arch: x64
            target: mac-x64
          - runner: ubuntu-24.04
            arch: x64
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: mise run install
      - name: Prepare isolated signing inputs
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID MACOS_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "$name is required" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/hukube-signing/tmp"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/hukube-signing/identity.p12"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/hukube-signing/AuthKey.p8"
          {
            echo "APP_BUILDER_TMP_DIR=$RUNNER_TEMP/hukube-signing/tmp"
            echo "CSC_LINK=$RUNNER_TEMP/hukube-signing/identity.p12"
            echo "APPLE_API_KEY=$RUNNER_TEMP/hukube-signing/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$MACOS_NOTARY_KEY_ID"
            echo "APPLE_API_ISSUER=$MACOS_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build release candidates without publication
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: mise run package:release -- "$ARCH"
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        working-directory: e2e
        run: |
          bunx playwright install-deps chromium
          sudo apt-get install -y xvfb
      - name: Verify package identity and native runtime
        run: |
          version="${RELEASE_TAG#v}"
          directory=".data/packages/release/$version/$TARGET"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a mise run release:verify -- "$directory" "$TARGET" release
          else
            mise run release:verify -- "$directory" "$TARGET" release
          fi
      - name: Verify a real two-version update on the target OS
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          HUKUBE_SIGN_UPDATE_TEST: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a mise run update:verify -- "$ARCH"
          else
            mise run update:verify -- "$ARCH"
          fi
      - name: Remove signing inputs on success or failure
        if: always() && runner.os == 'macOS'
        run: |
          for keychain in "$RUNNER_TEMP"/hukube-signing/tmp/*.keychain*; do
            [[ -e "$keychain" ]] || continue
            security delete-keychain "$keychain" || true
          done
          rm -rf "$RUNNER_TEMP/hukube-signing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.target }}
          path: .data/packages/release/*/${{ matrix.target }}/candidates/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: mise run install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          merge-multiple: true
          path: .data/release-candidates
      - run: mise run release:assemble
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Require release immutability before publication
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled' | rg '^true$'
      - name: Attach complete draft, publish once, and verify release attestation
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: mise run release:publish
