name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Caches are restored on every run but saved only from main, so pull requests
# reuse main's caches instead of each storing their own copy.
jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # Without these, every run compiles the Kubernetes client libraries from
      # scratch for golangci-lint and the race-enabled tests.
      - name: Restore Go and envtest caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.local/share/kubebuilder-envtest
          key: check-${{ runner.os }}-${{ hashFiles('engine/go.sum', 'mise.lock') }}
          restore-keys: check-${{ runner.os }}-
      - run: mise run install
      - run: mise run check
      - name: Save Go and envtest caches
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.local/share/kubebuilder-envtest
          key: ${{ steps.cache.outputs.cache-primary-key }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Restore Go and Playwright caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('engine/go.sum', 'mise.lock', 'bun.lock') }}
          restore-keys: e2e-${{ runner.os }}-
      - run: mise run install
      - name: Install system dependencies for Chromium, Electron, and Xvfb
        working-directory: e2e
        run: |
          bunx playwright install-deps chromium
          sudo apt-get install -y xvfb
      - run: mise run e2e
      - name: Save Go and Playwright caches
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/ms-playwright
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
