# Installed by `mise run setup`. Formats staged files, then lints and
# typechecks what they can affect. `mise run check` and CI run everything,
# including tests.
pre-commit:
  piped: true
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: oxfmt
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,html,md,yml,yaml,toml}"
            run: mise run fmt:oxfmt -- {staged_files}
            stage_fixed: true
          - name: gofmt
            root: engine/
            glob: "*.go"
            run: mise run fmt:go -- {staged_files}
            stage_fixed: true

    # After formatting, which may rewrite the protocol's Go source.
    - name: protocol
      glob:
        - "engine/internal/protocol/*.go"
        - "engine/tygo.yaml"
        - "packages/engine-client/src/protocol.gen.ts"
      run: mise run gen:check:staged

    - name: lint
      group:
        parallel: true
        jobs:
          - name: oxlint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: mise run lint:ts -- {staged_files}
          - name: oxlint-config
            glob: [".oxlintrc.json", "bun.lock", "*package.json", "*tsconfig*.json"]
            run: mise run lint:ts
          - name: format-config
            glob: ".oxfmtrc.json"
            run: mise run fmt:check
          # Type errors can surface in files that import a changed one, so
          # typecheck every project.
          - name: typecheck
            glob: ["*.{ts,tsx}", "*tsconfig*.json", "*package.json", "bun.lock"]
            run: mise run typecheck
          - name: golangci-lint
            root: engine/
            glob: "*.go"
            run: mise run lint:go -- {staged_files}
          - name: golangci-config
            glob: ["engine/.golangci.yml", "engine/go.mod", "engine/go.sum"]
            run: mise run lint:go
          - name: actions
            glob: ".github/*.{yml,yaml}"
            run: mise run lint:actions -- {staged_files}
          - name: mise-lock
            glob: ["mise.toml", "mise.lock"]
            run: mise run lint:mise
