[tools]
bun = "1.4.2"
go = "1.27.1"
golangci-lint = "2.14.0"
k3d = "5.9.0"
kubectl = "1.37.1"
"go:github.com/gzuidhof/tygo" = "0.2.21"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.25.1"

[env]
# Kubernetes version used for envtest's kube-apiserver and etcd binaries.
ENVTEST_K8S_VERSION = "1.37.x"
# k3d cluster used by end-to-end tests, and its kubeconfig. The cluster is kept
# out of ~/.kube/config so tests never touch your own contexts.
E2E_CLUSTER = "hukube-e2e"
E2E_KUBECONFIG = "{{config_root}}/.data/e2e/kubeconfig"

[settings]
experimental = true

# --- Setup ---

[tasks.install]
description = "Install JavaScript dependencies"
run = "bun install --frozen-lockfile"

[tasks.gen]
description = "Generate TypeScript protocol types from the Engine's Go definitions"
dir = "engine"
run = "tygo generate"

# --- Development ---

[tasks."build:engine"]
description = "Build the Engine binary into engine/bin"
dir = "engine"
run = "go build -o bin/hukube-engine ./cmd/hukube-engine"

[tasks."dev:engine"]
description = "Run the Engine for UI development against the Vite dev server"
depends = ["build:engine"]
run = "engine/bin/hukube-engine --listen 127.0.0.1:7443 --token dev --data-dir .data/engine"

[tasks."dev:ui"]
description = "Run the UI dev server (open http://localhost:5173/#token=dev)"
dir = "apps/app"
run = "bun run dev"

[tasks.dev]
description = "Run the Engine and the UI dev server for the web Host"
depends = ["dev:engine", "dev:ui"]

[tasks."dev:tailnet"]
description = "Run the web Host for other devices on your tailnet, over plain HTTP on the Tailscale IP"
depends = ["build:engine"]
# The Engine stays on loopback, on a free port so this can run alongside
# `mise run dev`; Vite binds only to the Tailscale IP and proxies the control
# socket to it. Set HUKUBE_TAILNET_HOST (for example in mise.local.toml) to use
# a hostname other than this node's MagicDNS name.
run = '''
#!/usr/bin/env bash
set -euo pipefail
ip="${HUKUBE_TAILNET_IP:-$(tailscale ip -4 | head -n1)}"
host="${HUKUBE_TAILNET_HOST:-$(tailscale status --json | bun -e \
  'console.log(JSON.parse(await Bun.stdin.text()).Self.DNSName.replace(/\.$/, ""))')}"
# A fresh token per run: anyone on the tailnet with the URL gets the
# Engine's cluster access.
token="$(openssl rand -hex 24)"

coproc ENGINE {
  HUKUBE_TOKEN="$token" exec engine/bin/hukube-engine --listen 127.0.0.1:0 --data-dir .data/engine
}
engine_pid=$ENGINE_PID
trap 'kill "$engine_pid" 2>/dev/null || true' EXIT
# The Engine prints one JSON line with its URL once it listens.
if ! read -r ready <&"${ENGINE[0]}"; then
  echo "The Engine failed to start." >&2
  exit 1
fi
engine_url="$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' <<<"$ready")"

echo "hukube on your tailnet: http://${host}:5173/#token=${token}"
cd apps/app
HUKUBE_ENGINE_URL="$engine_url" HUKUBE_DEV_ALLOWED_HOSTS="$host" bunx vite --host "$ip"
'''

[tasks."dev:desktop:electron"]
description = "Run Electron against the UI dev server once it is up"
depends = ["build:engine"]
dir = "apps/desktop"
# Extra Electron flags come from $HUKUBE_ELECTRON_FLAGS, such as --no-sandbox on
# Linux hosts that block unprivileged user namespaces (Ubuntu 24.04+).
run = '''
until curl -sf http://localhost:5173 >/dev/null; do sleep 0.5; done
bun run build
HUKUBE_UI_URL=http://localhost:5173 bunx electron . ${HUKUBE_ELECTRON_FLAGS:-}
'''

[tasks."dev:desktop"]
description = "Run the desktop Host with the UI dev server"
depends = ["dev:ui", "dev:desktop:electron"]

[tasks."build:ui"]
description = "Build the UI bundle into apps/app/dist"
dir = "apps/app"
run = "bun run build"

[tasks."build:desktop"]
description = "Build the desktop Host's main and preload bundles"
dir = "apps/desktop"
run = "bun run build"

[tasks.build]
description = "Build the Engine, UI, and desktop Host"
depends = ["build:engine", "build:ui", "build:desktop"]

[tasks.package]
description = "Package the desktop app for the current platform"
depends = ["build"]
dir = "apps/desktop"
run = "bun run package"

[tasks.web]
description = "Serve the built UI from the Engine (web Host), open the printed URL"
depends = ["build:engine", "build:ui"]
run = "engine/bin/hukube-engine --web --ui-dir apps/app/dist --data-dir .data/engine"

# --- Checks ---

[tasks."lint:ts"]
description = "Lint TypeScript with type-aware oxlint"
run = "bunx oxlint --type-aware --deny-warnings"

[tasks."lint:go"]
description = "Lint the Engine"
dir = "engine"
run = "golangci-lint run ./..."

[tasks.lint]
description = "Run all linters"
depends = ["lint:ts", "lint:go"]

[tasks.fmt]
description = "Format all code"
run = ["bunx oxfmt", "cd engine && golangci-lint fmt ./..."]

[tasks."fmt:check"]
description = "Check formatting without writing changes"
run = ["bunx oxfmt --check", "cd engine && golangci-lint fmt --diff ./..."]

[tasks.typecheck]
description = "Typecheck all TypeScript projects"
run = "bun run --filter '*' typecheck"

[tasks."test:ts"]
description = "Run TypeScript unit tests"
run = "bunx vitest run"

[tasks."test:engine"]
description = "Run Engine unit and envtest integration tests"
dir = "engine"
run = 'KUBEBUILDER_ASSETS="$(setup-envtest use -p path "$ENVTEST_K8S_VERSION")" go test -race ./...'

[tasks.test]
description = "Run all unit and integration tests"
depends = ["test:ts", "test:engine"]

[tasks."gen:check"]
description = "Fail if generated protocol types are out of date"
depends = ["gen"]
run = "git diff --exit-code -- packages/engine-client/src/protocol.gen.ts"

[tasks.check]
description = "Run every fast check: formatting, lint, typecheck, generated code, tests"
depends = ["fmt:check", "lint", "typecheck", "gen:check", "test"]

# --- End-to-end ---

[tasks."e2e:cluster"]
description = "Create the k3d cluster used by end-to-end tests, if missing, and write its kubeconfig to .data/e2e"
run = '''
k3d cluster list "$E2E_CLUSTER" >/dev/null 2>&1 || \
  k3d cluster create "$E2E_CLUSTER" --no-lb --wait --timeout 180s \
    --kubeconfig-update-default=false --kubeconfig-switch-context=false \
    --k3s-arg "--disable=traefik,metrics-server@server:0"
mkdir -p .data/e2e
k3d kubeconfig get "$E2E_CLUSTER" > "$E2E_KUBECONFIG"
'''

[tasks."e2e:cluster:delete"]
description = "Delete the end-to-end k3d cluster"
run = 'k3d cluster delete "$E2E_CLUSTER"'

[tasks."e2e:browsers"]
description = "Install the Chromium build Playwright drives"
dir = "e2e"
run = "bunx playwright install chromium"

[tasks.e2e]
description = "Run end-to-end tests for the web and desktop Hosts against the k3d cluster"
depends = ["e2e:cluster", "e2e:browsers", "build"]
dir = "e2e"
# Electron needs a display; use a virtual one on headless Linux.
run = '''
if [ "$(uname)" = Linux ] && [ -z "${DISPLAY:-}" ] && [ -z "${WAYLAND_DISPLAY:-}" ]; then
  xvfb-run -a bunx playwright test
else
  bunx playwright test
fi
'''
