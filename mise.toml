[tools]
bun = "1.4.2"
go = "1.27.1"
# Vitest, Playwright, and electron-builder run on Node.
node = "24.21.0"
golangci-lint = "2.14.0"
k3d = "5.9.0"
kubectl = "1.37.1"
"go:github.com/gzuidhof/tygo" = "0.2.21"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.25.1"
actionlint = "1.7.12"
lefthook = "2.1.14"
pinact = "5.0.0"
zizmor = "1.30.1"

[env]
# Kubernetes version used for envtest's kube-apiserver and etcd binaries.
ENVTEST_K8S_VERSION = "1.37.x"
# k3d cluster used by end-to-end tests, and its kubeconfig. The cluster is kept
# out of ~/.kube/config so tests never touch your own contexts.
E2E_CLUSTER = "hukube-e2e"
E2E_KUBECONFIG = "{{config_root}}/.data/e2e/kubeconfig"

[settings]
experimental = true
# Skip tool releases younger than 7 days when resolving or upgrading versions.
minimum_release_age = "7d"

# --- Setup ---

[tasks.install]
description = "Install JavaScript dependencies"
run = "bun install --frozen-lockfile"

[tasks.setup]
description = "Install JavaScript dependencies and the Git pre-commit hook"
depends = ["install"]
run = "lefthook install"

[tasks.gen]
description = "Generate TypeScript protocol types from the Engine's Go definitions"
dir = "engine"
run = "tygo generate"

# --- Development ---

[tasks."build:engine"]
description = "Build the Engine binary into engine/bin"
dir = "engine"
run = "go build -o bin/hukube-engine ./cmd/hukube-engine"

[tasks."dev:engine"]
description = "Run the Engine for UI development against the Vite dev server"
depends = ["build:engine"]
run = "engine/bin/hukube-engine --listen 127.0.0.1:7443 --token dev --data-dir .data/engine"

[tasks."dev:ui"]
description = "Run the UI dev server (open http://localhost:5173/#token=dev)"
dir = "apps/app"
run = "bun run dev"

[tasks.dev]
description = "Run the Engine and the UI dev server for the web Host"
depends = ["dev:engine", "dev:ui"]

[tasks."dev:tailnet"]
description = "Run the web Host for other devices on your tailnet, over plain HTTP on the Tailscale IP"
depends = ["build:engine"]
# The Engine stays on loopback, on a free port so this can run alongside
# `mise run dev`; Vite binds only to the Tailscale IP and proxies the control
# socket to it. Set HUKUBE_TAILNET_HOST (for example in mise.local.toml) to use
# a hostname other than this node's MagicDNS name.
run = '''
#!/usr/bin/env bash
set -euo pipefail
ip="${HUKUBE_TAILNET_IP:-$(tailscale ip -4 | head -n1)}"
host="${HUKUBE_TAILNET_HOST:-$(tailscale status --json | bun -e \
  'console.log(JSON.parse(await Bun.stdin.text()).Self.DNSName.replace(/\.$/, ""))')}"
# A fresh token per run: anyone on the tailnet with the URL gets the
# Engine's cluster access.
token="$(openssl rand -hex 24)"

coproc ENGINE {
  # Its own data dir: Engines cache settings in memory, so two sharing one
  # would overwrite each other's saved layouts.
  HUKUBE_TOKEN="$token" exec engine/bin/hukube-engine --listen 127.0.0.1:0 \
    --allow-host "$host" --allow-host "$ip" --data-dir .data/engine-tailnet
}
engine_pid=$ENGINE_PID
trap 'kill "$engine_pid" 2>/dev/null || true' EXIT
# The Engine prints one JSON line with its URL once it listens.
if ! read -r ready <&"${ENGINE[0]}"; then
  echo "The Engine failed to start." >&2
  exit 1
fi
engine_url="$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' <<<"$ready")"

echo "hukube on your tailnet: http://${host}:5173/#token=${token}"
cd apps/app
HUKUBE_ENGINE_URL="$engine_url" HUKUBE_DEV_ALLOWED_HOSTS="$host" bunx vite --host "$ip"
'''

[tasks."dev:desktop:electron"]
description = "Run Electron against the UI dev server once it is up"
depends = ["build:engine"]
dir = "apps/desktop"
# Extra Electron flags come from $HUKUBE_ELECTRON_FLAGS, such as --no-sandbox on
# Linux hosts that block unprivileged user namespaces (Ubuntu 24.04+).
run = '''
until curl -sf http://localhost:5173 >/dev/null; do sleep 0.5; done
bun run build
HUKUBE_UI_URL=http://localhost:5173 bunx electron . ${HUKUBE_ELECTRON_FLAGS:-}
'''

[tasks."dev:desktop"]
description = "Run the desktop Host with the UI dev server"
depends = ["dev:ui", "dev:desktop:electron"]

[tasks."build:ui"]
description = "Build the UI bundle into apps/app/dist"
dir = "apps/app"
run = "bun run build"

[tasks."build:desktop"]
description = "Build the desktop Host's main and preload bundles"
dir = "apps/desktop"
run = "bun run build"

[tasks.build]
description = "Build the Engine, UI, and desktop Host"
depends = ["build:engine", "build:ui", "build:desktop"]

[tasks.package]
description = "Package the desktop app for the current platform"
depends = ["build"]
dir = "apps/desktop"
run = "bun run package"

[tasks.web]
description = "Serve the built UI from the Engine (web Host), open the printed URL"
depends = ["build:engine", "build:ui"]
run = "engine/bin/hukube-engine --web --ui-dir apps/app/dist --data-dir .data/engine"

# --- Checks ---

[tasks."lint:ts"]
description = "Lint TypeScript with type-aware oxlint, or only the given files"
run = "./node_modules/.bin/oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern"

[tasks."lint:go"]
description = "Lint the Engine, or only the packages holding the given files"
dir = "engine"
usage = 'arg "[file]" var=#true help="Go files or package directories, relative to engine/"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "set -- ${usage_file:-./...}"
# golangci-lint checks whole packages, so lint the directories holding files.
pkgs=()
for arg in "$@"; do
  [[ "$arg" == *.go ]] && arg="$(dirname "$arg")"
  [[ "$arg" == ./* || "$arg" == /* ]] || arg="./$arg"
  pkgs+=("$arg")
done
unique_pkgs=()
while IFS= read -r pkg; do unique_pkgs+=("$pkg"); done < <(printf '%s\n' "${pkgs[@]}" | sort -u)
golangci-lint run "${unique_pkgs[@]}"
'''

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows and Dependabot config, or only the given files, including that actions are pinned to commit SHAs"
usage = 'arg "[file]" var=#true help="Files under .github"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "set -- ${usage_file:-}"
workflows=()
for f in "$@"; do
  if [[ "$f" == .github/workflows/* ]]; then workflows+=("$f"); fi
done
# actionlint reads only workflows, and finds them all when given none.
if [[ $# -eq 0 ]]; then
  actionlint
elif [[ -n "${workflows[*]-}" ]]; then
  actionlint "${workflows[@]}"
fi
zizmor --offline --quiet "${@:-.github}"
'''

[tasks."lint:mise"]
description = "Fail if mise.lock lacks a tool from mise.toml or a platform's download URL"
run = "bun scripts/check-mise-lock.ts"

[tasks.lint]
description = "Run all linters"
depends = ["lint:ts", "lint:go", "lint:actions", "lint:mise"]

[tasks."pin:actions"]
description = "Pin GitHub Actions in workflows to commit SHAs"
run = "pinact run"

[tasks.fmt]
description = "Format all code"
depends = ["fmt:oxfmt", "fmt:go"]

[tasks."fmt:oxfmt"]
description = "Format everything but Go with oxfmt, or only the given files"
run = "./node_modules/.bin/oxfmt --no-error-on-unmatched-pattern"

[tasks."fmt:go"]
description = "Format the Engine, or only the given files relative to engine/"
dir = "engine"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Check formatting without writing changes"
run = ["./node_modules/.bin/oxfmt --check", "cd engine && golangci-lint fmt --diff ./..."]

[tasks.typecheck]
description = "Typecheck all TypeScript projects"
run = "bun run --filter '*' typecheck"

[tasks."test:ts"]
description = "Run TypeScript unit tests"
run = "./node_modules/.bin/vitest run"

[tasks."test:engine"]
description = "Run Engine unit and envtest integration tests"
dir = "engine"
run = 'KUBEBUILDER_ASSETS="$(setup-envtest use -p path "$ENVTEST_K8S_VERSION")" go test -race ./...'

[tasks.test]
description = "Run all unit and integration tests"
depends = ["test:ts", "test:engine"]

[tasks."gen:check"]
description = "Fail if generated protocol types are out of date, and regenerate them"
run = '''
#!/usr/bin/env bash
set -euo pipefail
file=packages/engine-client/src/protocol.gen.ts
before="$(mktemp)"
trap 'rm -f "$before"' EXIT
cp "$file" "$before"
mise run gen
if ! cmp -s "$before" "$file"; then
  git diff --no-index -- "$before" "$file" || true
  echo "protocol.gen.ts was out of date; this check regenerated it." >&2
  exit 1
fi
'''

[tasks."gen:check:staged"]
description = "Fail if the staged protocol types differ from freshly generated ones"
run = '''
set -eu
if ! git diff --quiet -- engine/internal/protocol engine/tygo.yaml || \
  [ -n "$(git ls-files --others --exclude-standard -- engine/internal/protocol engine/tygo.yaml)" ]; then
  echo "Stage or stash protocol source changes before checking the staged generated types." >&2
  exit 1
fi
mise run gen
git diff --exit-code -- packages/engine-client/src/protocol.gen.ts || {
  echo "The staged protocol.gen.ts is out of date: stage the file \`mise run gen\` wrote." >&2
  exit 1
}
'''

[tasks.check]
description = "Run every fast check: formatting, lint, typecheck, generated code, tests"
depends = ["fmt:check", "lint", "typecheck", "gen:check", "test"]

# --- End-to-end ---

[tasks."e2e:cluster"]
description = "Create the k3d cluster used by end-to-end tests, if missing, and write its kubeconfig to .data/e2e"
run = '''
k3d cluster list "$E2E_CLUSTER" >/dev/null 2>&1 || \
  k3d cluster create "$E2E_CLUSTER" --no-lb --wait --timeout 180s \
    --kubeconfig-update-default=false --kubeconfig-switch-context=false \
    --k3s-arg "--disable=traefik,metrics-server@server:0"
mkdir -p .data/e2e
k3d kubeconfig get "$E2E_CLUSTER" > "$E2E_KUBECONFIG"
'''

[tasks."e2e:cluster:delete"]
description = "Delete the end-to-end k3d cluster"
run = 'k3d cluster delete "$E2E_CLUSTER"'

[tasks."e2e:browsers"]
description = "Install the Chromium build Playwright drives"
dir = "e2e"
run = "bunx playwright install chromium"

# --- Checking UI changes ---

[tasks."dev:verify:seed"]
description = "Apply the sample Resources in e2e/fixtures/sample to the e2e cluster"
depends = ["e2e:cluster"]
run = '''
kubectl --kubeconfig "$E2E_KUBECONFIG" apply -f e2e/fixtures/sample/crds.yaml
kubectl --kubeconfig "$E2E_KUBECONFIG" wait --for condition=established --timeout 30s \
  crd/widgets.sample.hukube.dev
kubectl --kubeconfig "$E2E_KUBECONFIG" apply -f e2e/fixtures/sample/resources.yaml
'''

[tasks."dev:verify"]
description = "Build the UI and start a background web Host against the seeded e2e cluster, printing its URL"
depends = ["build:engine", "build:ui", "dev:verify:seed"]
# A free port and its own data dir, so worktrees can each run one.
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="$PWD/.data/verify"
mise run dev:verify:stop
mkdir -p "$dir"
token="$(openssl rand -hex 16)"
HUKUBE_TOKEN="$token" nohup "$PWD/engine/bin/hukube-engine" --web --ui-dir "$PWD/apps/app/dist" \
  --listen 127.0.0.1:0 --kubeconfig "$E2E_KUBECONFIG" --data-dir "$dir/engine" \
  >"$dir/engine.out" 2>"$dir/engine.log" </dev/null &
pid=$!
trap 'kill "$pid" 2>/dev/null || true; rm -f "$dir/engine.pid" "$dir/url"' EXIT
# The Engine prints one JSON line with its URL once it listens.
url=""
for _ in $(seq 100); do
  url="$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' "$dir/engine.out")"
  if [[ -n "$url" ]] || ! kill -0 "$pid" 2>/dev/null; then break; fi
  sleep 0.1
done
if [[ -z "$url" ]]; then
  echo "The Engine did not start; see $dir/engine.log." >&2
  exit 1
fi
# Record start time and the exact command, including this checkout's paths.
identity="$(ps -ww -p "$pid" -o lstart= -o command=)"
[[ -n "$identity" ]] || exit 1
printf '%s\n%s\n' "$pid" "$identity" >"$dir/engine.pid"
echo "$url/#token=$token" >"$dir/url"
trap - EXIT
echo "hukube: $url/#token=$token"
echo "Engine log: $dir/engine.log. Stop it with \`mise run dev:verify:stop\`."
'''

[tasks."dev:verify:stop"]
description = "Stop the web Host that dev:verify started"
run = '''
#!/usr/bin/env bash
set -euo pipefail
pid_file=.data/verify/engine.pid
[[ -f "$pid_file" ]] || exit 0
pid="$(sed -n '1p' "$pid_file")"
identity="$(sed -n '2p' "$pid_file")"
[[ "$pid" =~ ^[0-9]+$ ]] && [[ "$pid" -gt 0 ]] || {
  echo "Invalid Engine PID record: $pid_file." >&2
  exit 1
}
current="$(ps -ww -p "$pid" -o lstart= -o command= 2>/dev/null || true)"
if [[ -n "$current" ]]; then
  if [[ -z "$identity" || "$current" != "$identity" ]]; then
    echo "The Engine PID record no longer identifies its process; leaving PID $pid running." >&2
    exit 1
  fi
  kill "$pid"
  for _ in $(seq 50); do
    current="$(ps -ww -p "$pid" -o lstart= -o command= 2>/dev/null || true)"
    [[ "$current" == "$identity" ]] || break
    sleep 0.1
  done
  if [[ "$current" == "$identity" ]]; then
    echo "The Engine did not stop; retaining $pid_file so cleanup can be retried." >&2
    exit 1
  fi
fi
rm -f "$pid_file" .data/verify/url
'''

[tasks.e2e]
description = "Run end-to-end tests for the web and desktop Hosts against the k3d cluster"
depends = ["e2e:cluster", "e2e:browsers", "build"]
dir = "e2e"
# Electron needs a display; use a virtual one on headless Linux.
run = '''
if [ "$(uname)" = Linux ] && [ -z "${DISPLAY:-}" ] && [ -z "${WAYLAND_DISPLAY:-}" ]; then
  xvfb-run -a bunx playwright test
else
  bunx playwright test
fi
'''
