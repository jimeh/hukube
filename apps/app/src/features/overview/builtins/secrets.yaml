version: 1
resourceType: secrets
apiVersions:
  - v1
title: Secret
sections:
  - id: configuration
    title: Configuration
    fields:
      - id: secretType
        type: field
        label: Type
        path:
          - type
        format: badge
      - id: data
        type: map
        label: Data
        path:
          - data
        empty: No data
        sensitive: true
      - id: stringData
        type: map
        label: String data
        path:
          - stringData
        empty: No string data
        sensitive: true
      - id: immutable
        type: field
        label: Immutable
        path:
          - immutable
        format: boolean
  - id: metadata
    title: Metadata
    fields:
      - id: labels
        type: map
        label: Labels
        path:
          - metadata
          - labels
        empty: No labels
        edit:
          type: string
          remove: true
      - id: annotations
        type: map
        label: Annotations
        path:
          - metadata
          - annotations
        empty: No annotations
        edit:
          type: string
          remove: true
      - id: created
        type: field
        label: Created
        path:
          - metadata
          - creationTimestamp
        format: timestamp
