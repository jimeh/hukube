version: 1
resourceType: persistentvolumes
apiVersions:
  - v1
title: PersistentVolume
sections:
  - id: configuration
    title: Configuration
    fields:
      - id: capacity
        type: map
        label: Capacity
        path:
          - spec
          - capacity
        empty: No capacity
      - id: storageClass
        type: field
        label: Storage class
        path:
          - spec
          - storageClassName
        format: text
      - id: reclaim
        type: field
        label: Reclaim policy
        path:
          - spec
          - persistentVolumeReclaimPolicy
        format: badge
        edit:
          type: enum
          choices:
            - Retain
            - Delete
            - Recycle
      - id: accessModes
        type: field
        label: Access modes
        path:
          - spec
          - accessModes
        format: multiline
      - id: phase
        type: field
        label: Phase
        path:
          - status
          - phase
        format: badge
      - id: claim
        type: field
        label: Claim
        path:
          - spec
          - claimRef
          - name
        format: text
  - id: metadata
    title: Metadata
    fields:
      - id: labels
        type: map
        label: Labels
        path:
          - metadata
          - labels
        empty: No labels
        edit:
          type: string
          remove: true
      - id: annotations
        type: map
        label: Annotations
        path:
          - metadata
          - annotations
        empty: No annotations
        edit:
          type: string
          remove: true
      - id: created
        type: field
        label: Created
        path:
          - metadata
          - creationTimestamp
        format: timestamp
