version: 1
resourceType: services
apiVersions:
  - v1
title: Service
sections:
  - id: configuration
    title: Configuration
    fields:
      - id: serviceType
        type: field
        label: Type
        path:
          - spec
          - type
        format: badge
        edit:
          type: enum
          choices:
            - ClusterIP
            - NodePort
            - LoadBalancer
            - ExternalName
      - id: clusterIP
        type: field
        label: Cluster IP
        path:
          - spec
          - clusterIP
        format: text
      - id: externalName
        type: field
        label: External name
        path:
          - spec
          - externalName
        format: text
        edit:
          type: string
          remove: true
      - id: selector
        type: map
        label: Selector
        path:
          - spec
          - selector
        empty: No selector
        edit:
          type: string
          remove: true
      - id: ports
        type: table
        label: Ports
        path:
          - spec
          - ports
        columns:
          - id: portName
            label: Name
            path:
              - name
            format: text
            edit:
              type: string
              remove: true
          - id: port
            label: Port
            path:
              - port
            format: number
            edit:
              type: integer
              min: 1
              max: 65535
          - id: targetPort
            label: Target port
            path:
              - targetPort
            format: text
          - id: protocol
            label: Protocol
            path:
              - protocol
            format: badge
          - id: nodePort
            label: Node port
            path:
              - nodePort
            format: number
        empty: No ports
  - id: metadata
    title: Metadata
    fields:
      - id: labels
        type: map
        label: Labels
        path:
          - metadata
          - labels
        empty: No labels
        edit:
          type: string
          remove: true
      - id: annotations
        type: map
        label: Annotations
        path:
          - metadata
          - annotations
        empty: No annotations
        edit:
          type: string
          remove: true
      - id: created
        type: field
        label: Created
        path:
          - metadata
          - creationTimestamp
        format: timestamp
